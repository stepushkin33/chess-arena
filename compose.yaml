services:
  server:
    build:
      context: .
      target: server
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_URL: https://${DOMAIN:?Set DOMAIN in .env}
      ALLOWED_ORIGINS: https://${DOMAIN:?Set DOMAIN in .env}
    expose:
      - '3000'
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      TLS_EMAIL: ${TLS_EMAIL:?Set TLS_EMAIL in .env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
